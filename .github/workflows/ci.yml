# The fast merge gates from docs/architecture.md#done-for-a-slice-or-core-change.
# crapper, dryer and mutator run on the author's machine (`pnpm ship`), not here:
# the mutator step alone took over an hour per run.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  rules:
    name: typecheck and dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: dependency-cruiser (rule fixtures run in the test job)
        run: pnpm depcruise

  test:
    name: vitest per package, real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: mojibun, POSTGRES_PASSWORD: mojibun, POSTGRES_DB: mojibun }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mojibun" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mojibun:mojibun@localhost:5432/mojibun
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packages

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://mojibun:mojibun@localhost:5432/mojibun
      APP_URL: http://localhost:5173
      AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      SEED_LEARNER_PASSWORD: learner-password
      SEED_SUPERVISOR_PASSWORD: supervisor-password
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - name: Compose stack
        run: docker compose up -d --wait postgres mailpit
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm --filter @mojibun/learner seed
      - run: pnpm --filter @mojibun/content-graph seed:fixture
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
