# The merge gates from docs/architecture.md#done-for-a-slice-or-core-change.
# A PR merges only when every job here passes.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  # unclebob's tools, cloned next to the repo as ub-mode expects (mutator needs ../crapper).
  CRAPPER_SHA: 6fd92c4c9bcc56efb64a2f8743d5a2993bcfd42d
  DRYER_SHA: 66ff6d21a42c04afcad89c78a80066176d1294b0
  MUTATOR_SHA: a5a0cb803b66e0cdb8bf471b3b08af701d424a41

jobs:
  rules:
    name: typecheck and dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: dependency-cruiser (rule fixtures run in the test job)
        run: pnpm depcruise

  test:
    name: vitest per package, real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ibbun, POSTGRES_PASSWORD: ibbun, POSTGRES_DB: ibbun }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibbun" --health-interval 5s --health-retries 10
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.14
        ports: ["9324:9324"]
    env:
      TEST_DATABASE_URL: postgres://ibbun:ibbun@localhost:5432/ibbun
      TEST_S3_ENDPOINT: http://localhost:8333
    steps:
      # A service container cannot take a command, and SeaweedFS needs one. Same image as compose.yaml.
      - name: Start S3 for the audio store and raw import file contract tests
        run: docker run -d -p 8333:8333 chrislusf/seaweedfs:4.53 server -s3 -dir=/data
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packages

  ub-gates:
    name: crapper, dryer, mutator
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: ibbun, POSTGRES_PASSWORD: ibbun, POSTGRES_DB: ibbun }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ibbun" --health-interval 5s --health-retries 10
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.14
        ports: ["9324:9324"]
    env:
      TEST_DATABASE_URL: postgres://ibbun:ibbun@localhost:5432/ibbun
      TEST_S3_ENDPOINT: http://localhost:8333
    steps:
      # A service container cannot take a command, and SeaweedFS needs one. Same image as compose.yaml.
      - name: Start S3 for the audio store and raw import file contract tests
        run: docker run -d -p 8333:8333 chrislusf/seaweedfs:4.53 server -s3 -dir=/data
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Cache crapper's tree-sitter parsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/tree-sitter-language-pack
          key: tree-sitter-parsers-${{ env.CRAPPER_SHA }}
      - name: Clone crapper, dryer and mutator next to the repo
        run: |
          for tool in crapper:$CRAPPER_SHA dryer:$DRYER_SHA mutator:$MUTATOR_SHA; do
            name=${tool%%:*}; sha=${tool#*:}
            git init -q "../$name"
            git -C "../$name" fetch -q --depth 1 "https://github.com/unclebob/$name" "$sha"
            git -C "../$name" checkout -q FETCH_HEAD
          done
      - run: pnpm install --frozen-lockfile
      - name: Coverage per package (LCOV for crapper and mutator)
        run: pnpm test:packages --coverage
      - name: Coverage of the Python scripts (LCOV for crapper)
        # SudachiPy is stubbed in the tests, so this needs neither the package
        # nor its dictionary. The other two are the supervisor's tooling.
        run: |
          pip install -q coverage
          coverage run --include=docker/sudachi/server.py -m unittest discover -s docker/sudachi
          coverage run --append --include=scripts/build-plan/*.py -m unittest discover -s scripts/build-plan
          coverage run --append --include='docs/research/pitch-accent-source/fetch_reference.py' -m unittest discover -s docs/research/pitch-accent-source
          mkdir -p target/coverage/python && coverage lcov -o target/coverage/python/lcov.info
      - name: Show this change to --changed
        # crapper and mutator read --changed from `git status`. A soft reset to
        # the base leaves every file the PR adds or edits staged.
        run: |
          base=${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          git reset -q --soft "$(git merge-base "$base" HEAD)"
          git status --short
      - name: crapper --changed (fails at CRAP 10 or above)
        # crapper downloads its tree-sitter parsers from GitHub on first use, and that
        # download sometimes returns 504. Retry only that failure; a CRAP failure stops at once.
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            if ../crapper/crapper --changed --use-existing-coverage --threshold 9.99 2>&1 | tee crapper.log; then exit 0; fi
            grep -q DownloadError crapper.log || exit 1
            echo "parser download failed (attempt $attempt); retrying"; sleep $((attempt * 30))
          done
          exit 1
      - name: dryer (fails at 0.8 inside a package, reports across packages)
        run: pnpm gate:dryer
      - name: mutator --changed (fails on a surviving mutant or uncovered code)
        run: pnpm gate:mutator --changed --use-existing-coverage

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ibbun:ibbun@localhost:5432/ibbun
      APP_URL: http://localhost:5173
      JOBS_QUEUE_URL: http://localhost:9324/000000000000/ibbun-jobs
      AUTH_SECRET: ci-only-secret-0123456789abcdefghijklmnop
      SEED_LEARNER_PASSWORD: learner-password
      SEED_SUPERVISOR_PASSWORD: supervisor-password
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - name: Compose stack
        run: docker compose up -d --wait postgres mailpit elasticmq
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm --filter @ibbun/learner seed
      - run: pnpm --filter @ibbun/content-graph seed:fixture
      - name: pnpm e2e, the API connecting as the app role
        run: pnpm e2e
        env:
          DATABASE_URL: postgres://ibbun_app:ibbun_app@localhost:5432/ibbun
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
