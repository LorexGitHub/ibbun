# TEMPORARY: proves verify-mojibun end to end (#57). Removed before merge.
name: verify-proof
on: pull_request
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - run: .agents/skills/verify-mojibun/scripts/verify.sh up
      - run: .agents/skills/verify-mojibun/scripts/verify.sh doctor
      - run: .agents/skills/verify-mojibun/scripts/verify.sh shot / shell/home && .agents/skills/verify-mojibun/scripts/verify.sh shot /nowhere shell/fallback && grep -q navigation target/verify/evidence/shell/home.aria.txt
      - run: env -u CI pnpm exec playwright test --project=anonymous
      - run: .agents/skills/verify-mojibun/scripts/verify.sh down
        if: always()
      - run: ls -R target/verify/evidence && cat target/verify/evidence/shell/*.aria.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: verify-evidence, path: target/verify }
