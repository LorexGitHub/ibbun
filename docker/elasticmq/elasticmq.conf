# The local stand-in for the stack's SQS queues (ADR 0015): one queue for every job,
# and a dead-letter queue that takes a job on its third failed receive.
include classpath("application.conf")

queues {
  ibbun-jobs {
    # 6 x the worker Lambda's 15-minute timeout, as AWS advises for an SQS trigger
    # (apps/worker/src/lambda-config.ts), so a running job is never handed out twice.
    defaultVisibilityTimeout = 5400 seconds
    deadLettersQueue {
      name = "ibbun-jobs-dead-letters"
      maxReceiveCount = 3
    }
  }
  ibbun-jobs-dead-letters {}
}
